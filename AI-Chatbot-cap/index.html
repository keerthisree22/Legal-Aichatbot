
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Info AI - Legal Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #ffffff;
    --sidebar: #f5f5f5;
    --text: #171717;
    --muted: #777777;
    --border: #e5e5e5;
    --hover: #e9e9e9;
    --input: #ffffff;
}

body.dark {
    --bg: #121212;
    --sidebar: #1c1c1c;
    --text: #f5f5f5;
    --muted: #aaaaaa;
    --border: #333333;
    --hover: #303030;
    --input: #202020;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* LEGAL LOGO */

.legal-logo {
    display: grid;
    place-items: center;
    background: var(--text);
    color: var(--bg);
    border-radius: 50%;
    flex-shrink: 0;
}

.legal-logo svg {
    width: 75%;
    height: 75%;
}

.mini-logo {
    width: 34px;
    height: 34px;
}

.center-logo {
    width: 96px;
    height: 96px;
    margin-bottom: 24px;
    box-shadow: 0 5px 22px rgba(128,128,128,0.12);
}

.logo-small {
    width: 60px;
    height: 60px;
    margin: 0 auto;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100%;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    transition: margin-left 0.25s;
    z-index: 5;
}

.sidebar.closed {
    margin-left: -260px;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding: 0 6px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: bold;
}

.icon-btn {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 9px;
    border-radius: 9px;
    font-size: 18px;
}

.icon-btn:hover,
.nav-btn:hover {
    background: var(--hover);
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    text-align: left;
    font-size: 14px;
    margin-bottom: 5px;
}

.nav-icon {
    width: 21px;
    text-align: center;
    font-size: 18px;
}

.section-title {
    color: var(--muted);
    font-size: 12px;
    margin: 25px 10px 10px;
}

.history-list {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
}

.history-item:hover,
.history-item.active {
    background: var(--hover);
}

.history-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
}

.delete-chat {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 3px;
    display: none;
}

.history-item:hover .delete-chat {
    display: block;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    font-size: 13px;
}

.avatar {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: bold;
}

/* MAIN AREA */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.topbar {
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.topbar-left,
.topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.topbar-title {
    font-size: 16px;
    font-weight: 600;
}

.signin-btn {
    padding: 9px 17px;
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
    border-radius: 22px;
    font-size: 13px;
}

.signout-btn {
    padding: 9px 15px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 22px;
    font-size: 13px;
}

.chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 15px 20px 25px;
}

.chat-content {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
}

/* WELCOME SCREEN */

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px 0 35px;
}

.welcome h1 {
    font-size: clamp(25px, 4vw, 35px);
    letter-spacing: -1px;
    margin-bottom: 12px;
}

.welcome p {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 440px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 30px;
    width: 100%;
    max-width: 520px;
}

.suggestion {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px;
    text-align: left;
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
}

.suggestion:hover {
    background: var(--sidebar);
}

.suggestion strong {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

/* CHAT MESSAGES */

.message {
    display: flex;
    gap: 12px;
    margin: 20px 0;
    align-items: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.message-bubble {
    max-width: 80%;
    padding: 13px 17px;
    border-radius: 17px;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user .message-bubble {
    background: var(--sidebar);
    border: 1px solid var(--border);
}

.bot .message-bubble {
    padding-left: 0;
}

.bot-mark {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
}

.message-image {
    max-width: 220px;
    max-height: 220px;
    display: block;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 10px;
}

.file-chip {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px;
    margin-top: 8px;
    font-size: 12px;
}

/* MESSAGE INPUT */

.composer-area {
    padding: 10px 20px 18px;
    flex-shrink: 0;
}

.composer {
    max-width: 800px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--input);
    border-radius: 23px;
    padding: 12px 14px 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.035);
}

.attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.attachment {
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 7px;
    max-width: 100%;
}

.attachment span {
    overflow-wrap: anywhere;
}

.remove-file {
    border: none;
    background: transparent;
    color: var(--muted);
}

.composer textarea {
    width: 100%;
    min-height: 35px;
    max-height: 150px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    padding: 10px 2px;
    line-height: 1.5;
}

.composer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.tools {
    display: flex;
    gap: 5px;
}

.tool-btn {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 8px 10px;
    border-radius: 12px;
    font-size: 13px;
}

.tool-btn:hover {
    background: var(--hover);
}

.send-btn {
    width: 37px;
    height: 37px;
    border: none;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    font-size: 19px;
}

.send-btn:hover {
    opacity: 0.8;
}

.footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    margin-top: 10px;
}

/* SIGN IN MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 20;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 380px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    position: relative;
}

.modal-box h2 {
    margin: 17px 0 9px;
    font-size: 24px;
}

.modal-box p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 18px;
}

.modal-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
}

.auth-mode-btn {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 8px;
    font-size: 13px;
}

.auth-mode-btn:hover {
    color: var(--text);
}

.modal-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--text);
    color: var(--bg);
    margin-bottom: 10px;
}

.modal-message {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
}

.mobile-overlay {
    display: none;
}

@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 260px;
        box-shadow: 5px 0 25px rgba(0,0,0,0.08);
    }

    .sidebar.closed {
        margin-left: -260px;
    }

    .mobile-overlay.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.25);
        z-index: 4;
    }

    .topbar {
        padding: 0 12px;
    }

    .chat-scroll {
        padding: 10px 13px;
    }

    .composer-area {
        padding: 8px 10px 12px;
    }

    .suggestions {
        grid-template-columns: 1fr;
        max-width: 360px;
    }

    .center-logo {
        width: 80px;
        height: 80px;
    }

    .welcome {
        padding-top: 25px;
        padding-bottom: 25px;
    }

    .message-bubble {
        max-width: 88%;
    }

    .tool-btn {
        padding: 8px;
    }
}
</style>
</head>

<body>
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <div class="brand">
                <div class="legal-logo mini-logo">
                    <svg viewBox="0 0 100 100" fill="none"
                         stroke="currentColor" stroke-width="4"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="50" cy="50" r="44"/>
                        <path d="M50 22 V72 M30 35 H70"/>
                        <path d="M30 35 L19 55 M30 35 L41 55"/>
                        <path d="M70 35 L59 55 M70 35 L81 55"/>
                        <path d="M14 55 Q30 69 46 55"/>
                        <path d="M54 55 Q70 69 86 55"/>
                        <path d="M39 76 H61 M33 83 H67"/>
                    </svg>
                </div>
                <span>Legal Info AI</span>
            </div>

            <button class="icon-btn" id="closeSidebar"
                    title="Close sidebar">☰</button>
        </div>

        <button class="nav-btn" id="newChatBtn">
            <span class="nav-icon">＋</span>
            <span>New Chat</span>
        </button>

        <button class="nav-btn" id="imagesBtn">
            <span class="nav-icon">▧</span>
            <span>Images</span>
        </button>

        <button class="nav-btn" id="uploadBtn">
            <span class="nav-icon">📎</span>
            <span>Upload Files</span>
        </button>

        <div class="section-title">YOUR CHATS</div>
        <div class="history-list" id="historyList"></div>

        <div class="sidebar-bottom">

            <button class="nav-btn" id="themeBtn">
                <span class="nav-icon" id="themeIcon">◐</span>
                <span id="themeLabel">Dark Mode</span>
            </button>

            <button class="nav-btn" id="sidebarSignIn">
                <span class="nav-icon">⇥</span>
                <span>Sign In</span>
            </button>

            <button class="nav-btn" id="sidebarSignOut"
                    style="display:none">
                <span class="nav-icon">⇤</span>
                <span>Sign Out</span>
            </button>

            <div class="profile">
                <div class="avatar" id="avatar">G</div>
                <div>
                    <div id="profileName">Guest User</div>
                    <div style="color:var(--muted);font-size:11px"
                         id="profileStatus">Not signed in</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="mobile-overlay" id="overlay"></div>

    <!-- MAIN CHAT -->
    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn" id="openSidebar"
                        title="Open sidebar" style="display:none">☰</button>
                <div class="topbar-title">
                    Legal Info AI <span style="color:var(--muted)">⌄</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="icon-btn" id="topSignIn">⇥ Sign In</button>
                <button class="signout-btn" id="topSignOut"
                        style="display:none">Sign Out</button>
            </div>
        </header>

        <section class="chat-scroll" id="chatScroll">
            <div class="chat-content" id="chatContent"></div>
        </section>

        <!-- MESSAGE COMPOSER -->
        <div class="composer-area">
            <div class="composer">

                <div class="attachments" id="attachments"></div>

                <textarea id="messageInput"
                          placeholder="Ask Legal Info AI a question..."
                          rows="1"></textarea>

                <div class="composer-bottom">
                    <div class="tools">
                        <button class="tool-btn" id="attachBtn">
                            ＋ Attach
                        </button>

                        <button class="tool-btn" id="imageToolBtn">
                            ▧ Images
                        </button>
                    </div>

                    <button class="send-btn" id="sendBtn"
                            title="Send message">↑</button>
                </div>

                <input type="file" id="fileInput" multiple hidden
                      accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp,application/pdf,text/plain,text/markdown,image/jpeg,image/png,image/webp">

                <input type="file" id="imageInput" multiple hidden
                       accept="image/*">
            </div>

            <div class="footer-note">
                Legal Info AI provides general legal information only.
                It does not replace advice from a qualified lawyer.
            </div>
        </div>
    </main>
</div>

<!-- SIGN IN MODAL -->
<div class="modal" id="signinModal">
    <div class="modal-box">
        <button class="icon-btn close-modal"
                id="closeModal">✕</button>

        <div class="legal-logo logo-small">
            <svg viewBox="0 0 100 100" fill="none"
                 stroke="currentColor" stroke-width="4"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="50" cy="50" r="44"/>
                <path d="M50 22 V72 M30 35 H70"/>
                <path d="M30 35 L19 55 M30 35 L41 55"/>
                <path d="M70 35 L59 55 M70 35 L81 55"/>
                <path d="M14 55 Q30 69 46 55"/>
                <path d="M54 55 Q70 69 86 55"/>
                <path d="M39 76 H61 M33 83 H67"/>
            </svg>
        </div>

        <h2 style="text-align:center">Welcome to Legal Info AI</h2>

        <p id="authDescription" style="text-align:center">
            Sign in to continue.
        </p>

        <form id="signinForm">
            <input type="text" id="nameInput"
                   placeholder="Your name" autocomplete="name" hidden>

            <input type="email" id="emailInput"
                   placeholder="Email address" autocomplete="email" required>

            <input type="password" id="passwordInput"
                   placeholder="Password" autocomplete="current-password"
                   minlength="6" required>

            <button type="submit" class="modal-submit" id="authSubmit">
                Sign In
            </button>
        </form>

        <button type="button" class="auth-mode-btn" id="authModeToggle">
            Need an account? Create one
        </button>

        <div class="modal-message" id="modalMessage" role="status" aria-live="polite"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    createUserWithEmailAndPassword,
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut as firebaseSignOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const chatContent = document.getElementById("chatContent");
const historyList = document.getElementById("historyList");
const messageInput = document.getElementById("messageInput");
const fileInput = document.getElementById("fileInput");
const imageInput = document.getElementById("imageInput");
const attachments = document.getElementById("attachments");

let chats = [];
let currentChatId = null;
let pendingFiles = [];
let user = null;

try {
    chats = JSON.parse(localStorage.getItem("legalInfoChats") || "[]");
    if (!Array.isArray(chats)) chats = [];
} catch (error) {
    chats = [];
}

// SIDEBAR

function toggleSidebar(show) {
    sidebar.classList.toggle("closed", !show);
    overlay.classList.toggle(
        "show", show && window.innerWidth <= 700
    );

    document.getElementById("openSidebar").style.display =
        show ? "none" : "inline-block";
}

document.getElementById("closeSidebar").onclick =
    () => toggleSidebar(false);

document.getElementById("openSidebar").onclick =
    () => toggleSidebar(true);

overlay.onclick = () => toggleSidebar(false);

function checkScreen() {
    if (window.innerWidth > 700) {
        sidebar.classList.remove("closed");
        overlay.classList.remove("show");
        document.getElementById("openSidebar").style.display = "none";
    } else {
        document.getElementById("openSidebar").style.display =
            sidebar.classList.contains("closed")
            ? "inline-block" : "none";
    }
}

window.addEventListener("resize", checkScreen);
checkScreen();

// SAVE CHAT HISTORY

function saveChats() {
    try {
        localStorage.setItem("legalInfoChats", JSON.stringify(chats));
    } catch (error) {
        alert("Browser storage is full. Please remove large images or chats.");
    }
}

function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId);
}

function createChat() {
    const chat = {
        id: Date.now().toString() +
            Math.random().toString(36).slice(2, 7),
        title: "New Chat",
        messages: []
    };

    chats.unshift(chat);
    currentChatId = chat.id;
    pendingFiles = [];

    saveChats();
    renderHistory();
    renderChat();
    renderAttachments();

    messageInput.value = "";
    messageInput.focus();

    if (window.innerWidth <= 700) toggleSidebar(false);
}

document.getElementById("newChatBtn").onclick = createChat;

// HISTORY

function renderHistory() {
    historyList.innerHTML = "";

    chats.forEach(chat => {
        const item = document.createElement("div");

        item.className = "history-item" +
            (chat.id === currentChatId ? " active" : "");

        const name = document.createElement("span");
        name.className = "history-name";
        name.textContent = chat.title;

        const del = document.createElement("button");
        del.className = "delete-chat";
        del.textContent = "×";
        del.title = "Delete chat";

        del.onclick = event => {
            event.stopPropagation();

            if (!confirm("Delete this chat?")) return;

            chats = chats.filter(c => c.id !== chat.id);

            if (currentChatId === chat.id) {
                currentChatId = null;
            }

            saveChats();
            renderHistory();
            renderChat();
        };

        item.onclick = () => {
            currentChatId = chat.id;
            pendingFiles = [];

            renderHistory();
            renderChat();
            renderAttachments();

            if (window.innerWidth <= 700) toggleSidebar(false);
        };

        item.append(name, del);
        historyList.appendChild(item);
    });
}

// LEGAL LOGO SVG

function logoMarkup() {
    return `
        <svg viewBox="0 0 100 100" fill="none"
             stroke="currentColor" stroke-width="4"
             stroke-linecap="round" stroke-linejoin="round">
            <circle cx="50" cy="50" r="44"/>
            <path d="M50 22 V72 M30 35 H70"/>
            <path d="M30 35 L19 55 M30 35 L41 55"/>
            <path d="M70 35 L59 55 M70 35 L81 55"/>
            <path d="M14 55 Q30 69 46 55"/>
            <path d="M54 55 Q70 69 86 55"/>
            <path d="M39 76 H61 M33 83 H67"/>
        </svg>`;
}

// WELCOME SCREEN

function showWelcome() {
    chatContent.innerHTML = "";

    const welcome = document.createElement("div");
    welcome.className = "welcome";

    welcome.innerHTML = `
        <div class="legal-logo center-logo">
            ${logoMarkup()}
        </div>

        <h1>Welcome to Legal Info AI</h1>

        <p>
            Your legal information assistant.<br>
            Explore legal procedures, documents and consumer rights.
        </p>

        <div class="suggestions">
            <button class="suggestion"
                    data-prompt="Explain the basic steps in filing a consumer complaint.">
                <strong>⚖ Consumer Rights</strong>
                Learn about consumer complaints
            </button>

            <button class="suggestion"
                    data-prompt="What documents are commonly needed when renting a house?">
                <strong>▤ Legal Documents</strong>
                Understand common documents
            </button>

            <button class="suggestion"
                    data-prompt="Explain the general steps involved in filing a police complaint in India.">
                <strong>⌕ Legal Procedures</strong>
                Understand common procedures
            </button>

            <button class="suggestion"
                    data-prompt="Explain some common legal terms in simple English.">
                <strong>✎ Legal FAQs</strong>
                Understand legal terminology
            </button>
        </div>
    `;

    chatContent.appendChild(welcome);

    welcome.querySelectorAll("[data-prompt]").forEach(button => {
        button.onclick = () => {
            messageInput.value = button.dataset.prompt;
            sendMessage();
        };
    });
}

// RENDER CHAT

function renderChat() {
    const chat = getCurrentChat();

    if (!chat || !chat.messages.length) {
        showWelcome();
        return;
    }

    chatContent.innerHTML = "";

    chat.messages.forEach(message => {
        const row = document.createElement("div");

        row.className = "message " +
            (message.role === "user" ? "user" : "bot");

        if (message.role === "bot") {
            const mark = document.createElement("div");
            mark.className = "legal-logo bot-mark";
            mark.innerHTML = logoMarkup();
            row.appendChild(mark);
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = message.text || "";

        if (message.files && message.files.length) {
            message.files.forEach(file => {
                const chip = document.createElement("div");
                chip.className = "file-chip";
                chip.textContent = "📎 " + file.name;
                bubble.appendChild(chip);

                if (file.type &&
                    file.type.startsWith("image/") && file.url) {

                    const img = document.createElement("img");
                    img.src = file.url;
                    img.alt = file.name;
                    img.className = "message-image";
                    bubble.appendChild(img);
                }
            });
        }

        row.appendChild(bubble);
        chatContent.appendChild(row);
    });

    const scroll = document.getElementById("chatScroll");
    scroll.scrollTop = scroll.scrollHeight;
}

// SEND MESSAGE

async function sendMessage() {
    const text = messageInput.value.trim();

    if (!text && pendingFiles.length === 0) return;

    if (!auth.currentUser) {
        openSignin();
        return;
    }

    if (!currentChatId) createChat();

    const chat = getCurrentChat();
    if (!chat) return;

    const filesForMessage = pendingFiles.map(file => ({
        name: file.name,
        type: file.type
    }));
    const filesToSend = [...pendingFiles];

    chat.messages.push({
        role: "user",
        text: text,
        files: filesForMessage
    });

    if (chat.title === "New Chat") {
        chat.title = text
            ? text.slice(0, 30) + (text.length > 30 ? "..." : "")
            : "Uploaded files";
    }

    messageInput.value = "";
    messageInput.style.height = "35px";
    pendingFiles = [];

    saveChats();
    renderHistory();
    renderChat();
    renderAttachments();

    const sendButton = document.getElementById("sendBtn");
    sendButton.disabled = true;
    sendButton.textContent = "…";

    try {
        const idToken = await auth.currentUser.getIdToken();
        const formData = new FormData();
        formData.append("message", text);
        filesToSend.forEach(file => formData.append("files", file, file.name));

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${idToken}`
            },
            body: formData
        });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "The assistant request failed.");
        }

        chat.messages.push({
            role: "bot",
            text: data.reply
        });
    } catch (error) {
        chat.messages.push({
            role: "bot",
            text: `I could not get a response: ${error.message}`
        });
    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "↑";
        saveChats();

        if (currentChatId === chat.id) renderChat();

        renderHistory();
    }
}

document.getElementById("sendBtn").onclick = sendMessage;

messageInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

messageInput.addEventListener("input", () => {
    messageInput.style.height = "35px";

    messageInput.style.height =
        Math.min(messageInput.scrollHeight, 150) + "px";
});

// FILE UPLOAD

document.getElementById("attachBtn").onclick =
    () => fileInput.click();

document.getElementById("uploadBtn").onclick =
    () => fileInput.click();

document.getElementById("imagesBtn").onclick =
    () => imageInput.click();

document.getElementById("imageToolBtn").onclick =
    () => imageInput.click();

function processFiles(fileList) {
    Array.from(fileList).forEach(file => {
        if (pendingFiles.length >= 3) {
            alert("Attach up to 3 files per message.");
            return;
        }

        if (file.size > 4 * 1024 * 1024) {
            alert(`${file.name} is larger than the 4 MB upload limit.`);
            return;
        }

        pendingFiles.push(file);
    });

    renderAttachments();
}

fileInput.onchange = () => {
    processFiles(fileInput.files);
    fileInput.value = "";
};

imageInput.onchange = () => {
    processFiles(imageInput.files);
    imageInput.value = "";
};

function renderAttachments() {
    attachments.innerHTML = "";

    pendingFiles.forEach((file, index) => {
        const chip = document.createElement("div");
        chip.className = "attachment";

        const label = document.createElement("span");
        label.textContent = "📎 " + file.name;

        const remove = document.createElement("button");
        remove.className = "remove-file";
        remove.textContent = "×";
        remove.title = "Remove file";

        remove.onclick = () => {
            pendingFiles.splice(index, 1);
            renderAttachments();
        };

        chip.append(label, remove);
        attachments.appendChild(chip);
    });
}

// SIGN IN / SIGN OUT DEMO

const signinModal = document.getElementById("signinModal");

function openSignin() {
    signinModal.classList.add("show");
}

function closeSignin() {
    signinModal.classList.remove("show");
}

document.getElementById("topSignIn").onclick = openSignin;
document.getElementById("sidebarSignIn").onclick = openSignin;
document.getElementById("closeModal").onclick = closeSignin;

signinModal.addEventListener("click", event => {
    if (event.target === signinModal) closeSignin();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeSignin();
});

function renderUser() {
    const signedIn = Boolean(user);

    document.getElementById("topSignIn").style.display =
        signedIn ? "none" : "inline-block";

    document.getElementById("topSignOut").style.display =
        signedIn ? "inline-block" : "none";

    document.getElementById("sidebarSignIn").style.display =
        signedIn ? "none" : "flex";

    document.getElementById("sidebarSignOut").style.display =
        signedIn ? "flex" : "none";

    document.getElementById("profileName").textContent =
        signedIn ? user.name : "Guest User";

    document.getElementById("profileStatus").textContent =
        signedIn ? user.email : "Not signed in";

    document.getElementById("avatar").textContent =
        signedIn ? user.name.charAt(0).toUpperCase() : "G";
}

const signinForm = document.getElementById("signinForm");
const nameInput = document.getElementById("nameInput");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const modalMessage = document.getElementById("modalMessage");
let authMode = "signin";

function setAuthMode(mode) {
    authMode = mode;
    const creatingAccount = mode === "signup";

    nameInput.hidden = !creatingAccount;
    nameInput.required = creatingAccount;
    passwordInput.autocomplete = creatingAccount ? "new-password" : "current-password";
    document.getElementById("authSubmit").textContent =
        creatingAccount ? "Create Account" : "Sign In";
    document.getElementById("authDescription").textContent =
        creatingAccount ? "Create an account to use the assistant." : "Sign in to continue.";
    document.getElementById("authModeToggle").textContent =
        creatingAccount ? "Already have an account? Sign in" : "Need an account? Create one";
    modalMessage.textContent = "";
}

document.getElementById("authModeToggle").onclick = () => {
    setAuthMode(authMode === "signin" ? "signup" : "signin");
};

signinForm.onsubmit = async event => {
    event.preventDefault();
    const submitButton = document.getElementById("authSubmit");
    submitButton.disabled = true;
    modalMessage.textContent = "";

    try {
        if (authMode === "signup") {
            const credential = await createUserWithEmailAndPassword(
                auth,
                emailInput.value.trim(),
                passwordInput.value
            );
            await updateProfile(credential.user, {
                displayName: nameInput.value.trim()
            });
        } else {
            await signInWithEmailAndPassword(
                auth,
                emailInput.value.trim(),
                passwordInput.value
            );
        }

        closeSignin();
        signinForm.reset();
        setAuthMode("signin");
    } catch (error) {
        const messages = {
            "auth/email-already-in-use": "An account already exists for that email.",
            "auth/invalid-credential": "Email or password is incorrect.",
            "auth/invalid-email": "Enter a valid email address.",
            "auth/weak-password": "Use a password with at least 6 characters.",
            "auth/operation-not-allowed": "Enable Email/Password sign-in in Firebase Authentication."
        };
        modalMessage.textContent = messages[error.code] || "Authentication failed. Check your Firebase setup and try again.";
    } finally {
        submitButton.disabled = false;
    }
};

async function signOut() {
    await firebaseSignOut(auth);
}

document.getElementById("topSignOut").onclick = signOut;
document.getElementById("sidebarSignOut").onclick = signOut;

onAuthStateChanged(auth, currentUser => {
    user = currentUser ? {
        name: currentUser.displayName || currentUser.email.split("@")[0],
        email: currentUser.email
    } : null;
    renderUser();
});

// THEME

document.getElementById("themeBtn").onclick = () => {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");

    document.getElementById("themeLabel").textContent =
        isDark ? "Light Mode" : "Dark Mode";

    document.getElementById("themeIcon").textContent =
        isDark ? "☼" : "◐";

    try {
        localStorage.setItem(
            "legalInfoTheme", isDark ? "dark" : "light"
        );
    } catch (error) {}
};

// INITIALIZE

try {
    if (localStorage.getItem("legalInfoTheme") === "dark") {
        document.body.classList.add("dark");
        document.getElementById("themeLabel").textContent = "Light Mode";
        document.getElementById("themeIcon").textContent = "☼";
    }
} catch (error) {}

renderUser();
renderHistory();

if (chats.length) {
    currentChatId = chats[0].id;
    renderChat();
} else {
    showWelcome();
}
</script>
